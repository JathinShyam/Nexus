name: nexus

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: nexus-postgres:16-postgis
    container_name: nexus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
      NEXUS_MIGRATE_PASSWORD: ${NEXUS_MIGRATE_PASSWORD:?set NEXUS_MIGRATE_PASSWORD}
      NEXUS_APP_PASSWORD: ${NEXUS_APP_PASSWORD:?set NEXUS_APP_PASSWORD}
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=nexus
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  nexus_pg_data:
